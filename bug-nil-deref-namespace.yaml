apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: nil-namespace-test
spec:
  schema:
    apiVersion: v1alpha1
    kind: NilNamespaceTest
    scope: Cluster
    spec:
      name: string
  resources:
    - id: cm
      resource:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: ${schema.spec.name}
        data:
          test: "value"
