---
# Custom CRD with ExternalDocs to trigger the bug
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mydatabases.example.com
spec:
  group: example.com
  names:
    kind: MyDatabase
    plural: mydatabases
    singular: mydatabase
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              engine:
                type: string
                description: Database engine type
                externalDocs:
                  description: "Documentation for supported database engines"
                  url: "https://example.com/docs/database-engines"
              size:
                type: integer
                description: Database size in GB
            required:
            - engine
