---
# Custom CRD with ExternalDocs at the TOP LEVEL to trigger the bug
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mytopleveldb.example.com
spec:
  group: example.com
  names:
    kind: MyTopLevelDB
    plural: mytopleveldb
    singular: mytopleveldb
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        externalDocs:
          description: "Top level documentation for the database CRD"
          url: "https://example.com/docs/database"
        properties:
          spec:
            type: object
            properties:
              engine:
                type: string
                description: Database engine type
              size:
                type: integer
                description: Database size in GB
            required:
            - engine
