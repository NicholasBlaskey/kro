apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: uniqueitems-test
spec:
  schema:
    apiVersion: v1alpha1
    kind: UniqueTest
    spec:
      tags: "[]string | uniqueItems=true"
      name: string | default=test

  resources:
    - id: configmap
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test-${schema.metadata.name}
        data:
          name: ${schema.spec.name}
