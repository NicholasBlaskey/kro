apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: test-minimum-error
spec:
  schema:
    apiVersion: v1alpha1
    kind: TestMinimumError
    spec:
      count: integer | minimum=notanumber

  resources:
    - id: config
      template:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test
        data:
          value: "test"
