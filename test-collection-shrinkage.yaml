apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: collection-shrink-bug
spec:
  schema:
    apiVersion: v1alpha1
    kind: ShrinkTest
    spec:
      podNames: '[]string'

  resources:
    - id: pods
      forEach:
        - name: "${schema.spec.podNames}"
      template:
        apiVersion: v1
        kind: Pod
        metadata:
          name: "${name}"
        spec:
          containers:
            - name: nginx
              image: nginx:latest
              command: ["sleep", "infinity"]

# How to reproduce:
# 1. Apply this RGD
# 2. Create instance with podNames=["pod-0", "pod-1", "pod-2", "pod-3", "pod-4"]
# 3. Update instance to podNames=["pod-0", "pod-1", "pod-2"]
# 4. BUG: pod-3 and pod-4 are ORPHANED and never deleted!
